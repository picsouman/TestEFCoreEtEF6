
name: "🐛 Bug Report"
description: "Signaler un bug"
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Résumé du bug
      description: Décris le problème.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Web
        - Android
        - iOS
        - Desktop
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Constater...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Gravité
      options:
        - Critique
        - Haute
        - Moyenne
        - Faible
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran / informations complémentaires
