name: Bug report
description: Report a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: Describe the bug. You can add screenshots by dragging and dropping them into this field.
      placeholder: As shown below, the airport weather detail disappears from the top left of the radar.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Detailed steps to reproduce the bug.
      value: 1.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should normally happen.
      placeholder: The displayed data should never disappear.
    validations:
      required: true

  - type: dropdown
    id: reproduction-frequency
    attributes:
      label: Reproduction Frequency
      description: How often does the bug occur?
      options:
        - Always (100%)
        - Often (> 50%)
        - Rarely
    validations:
      required: true

  - type: input
    id: impacted-milestone
    attributes:
      label: Impacted milestone
      description: Version or milestone affected.
      placeholder: "x.x.x"
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Logs, screenshots, links to the support conversation, etc.
    validations:
      required: false
